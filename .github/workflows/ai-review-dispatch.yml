# AI review of one pull request at one pinned head SHA, started by ai-review-command.yml after it
# has checked the commenter's permission. Only users with write access can start it, and it reviews
# only when run from the default branch, so the reviewer it runs is the default branch's.
name: AI review (dispatched)

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number
        type: number
        required: true
      head-sha:
        description: The full head SHA to review
        type: string
        required: true

permissions: {}

run-name: AI review of PR ${{ inputs.pr-number }} at ${{ inputs.head-sha }}

jobs:
  # workflow_dispatch delivers every input as a string, even one declared `type: number`, and the
  # reusable lane takes a number. Check the inputs here and hand the lane a parsed number.
  check-inputs:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      pr-number: ${{ steps.check.outputs.pr-number }}
    steps:
      - name: Check the pull request number and head SHA
        id: check
        env:
          PR: ${{ inputs.pr-number }}
          HEAD_SHA: ${{ inputs.head-sha }}
        run: |
          if ! [[ "$PR" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "::error::pr-number must be a positive integer."
            exit 1
          fi
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::head-sha must be a full 40-character commit SHA."
            exit 1
          fi
          echo "pr-number=$PR" >> "$GITHUB_OUTPUT"

  lanes:
    needs: check-inputs
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      fail-fast: false
      matrix:
        lane: [opus, gpt]
    permissions:
      contents: read
      pull-requests: write
      checks: write
      id-token: write
    uses: ./.github/workflows/ai-review-lane.yml
    with:
      lane: ${{ matrix.lane }}
      pr-number: ${{ fromJSON(needs.check-inputs.outputs.pr-number) }}
      head-sha: ${{ inputs.head-sha }}
      trusted-ref: ${{ github.sha }}

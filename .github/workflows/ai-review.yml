# Advisory AI review of same-repo pull requests: a Claude lane and a GPT lane, blind to each other.
# Fork pull requests are never reviewed automatically; a maintainer comments /ai-review instead
# (see ai-review-command.yml). Dependabot pull requests are skipped.
name: AI review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  lanes:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.actor != 'dependabot[bot]'
      && !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        lane: [opus, gpt]
    permissions:
      contents: read
      pull-requests: write
      checks: write
      id-token: write
    uses: ./.github/workflows/ai-review-lane.yml
    with:
      lane: ${{ matrix.lane }}
      pr-number: ${{ github.event.pull_request.number }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      trusted-ref: ${{ github.event.pull_request.base.sha }}
      allow-head-fallback: true

name: PR Build
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    permissions:
      contents: read
    # The Lambda functions are bundled for arm64 in Docker; an x86 runner cannot run those images.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pnpm install
      - name: Check that the website's API types match the OpenAPI definition
        run: |
          npx nx run @aws-samples/smart-product-onboarding-demo-website:generate-api
          git diff --exit-code -- packages/website/src/api/schema.d.ts
      - name: Build and test the website
        run: npx nx run @aws-samples/smart-product-onboarding-demo-website:build
      - name: CDK Synth
        run: npx nx run @aws-samples/smart-product-onboarding-infra:synth

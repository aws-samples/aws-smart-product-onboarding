name: PR Build
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    permissions:
      contents: read
    # The Lambda functions are bundled for arm64 in Docker; an x86 runner cannot run those images.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pnpm install
      - name: Check that the generated API types match the OpenAPI definition
        run: |
          npx nx run @aws-samples/smart-product-onboarding-api-types:generate
          # status, not diff, so a regenerated file that isn't checked in also fails
          if [ -n "$(git status --porcelain -- packages/api/generated/types)" ]; then
            git status --short -- packages/api/generated/types
            git diff -- packages/api/generated/types
            exit 1
          fi
      - name: Check that the generated API models match the OpenAPI definition
        run: |
          npx nx run amzn-smart-product-onboarding-api-python-common:generate
          git diff --exit-code -- packages/smart-product-onboarding/api/common
      - name: CDK Synth
        run: npx nx run @aws-samples/smart-product-onboarding-infra:synth

  ai-review-tests:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: AI review script tests
        run: python3 -m unittest discover -s .github/ai-review/tests -v

# On-demand AI review, mainly for fork pull requests: a maintainer comments `/ai-review` (optionally
# `/ai-review <head-sha>`) on the pull request.
#
# issue_comment workflows always run from the default branch, so nothing in the pull request can
# change this file or the reviewer it calls. The commenter must have write or admin permission. The
# head SHA is pinned when the command is accepted, and the pull request is read as data only.
name: AI review (on request)

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  authorize:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/ai-review')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
      head-sha: ${{ steps.check.outputs.head-sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the reviewer from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/ai-review

      - name: Check the commenter's permission and pin the head
        id: check
        run: python3 .github/ai-review/command.py authorize

      - name: Tell the maintainer why the command was refused
        if: steps.check.outputs.allowed != 'true' && steps.check.outputs.reply == 'true'
        env:
          REASON: ${{ steps.check.outputs.reason }}
          PR: ${{ github.event.issue.number }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "AI review not started: $REASON."

  lanes:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    strategy:
      fail-fast: false
      matrix:
        lane: [opus, gpt]
    permissions:
      contents: read
      pull-requests: write
      checks: write
      id-token: write
    uses: ./.github/workflows/ai-review-lane.yml
    with:
      lane: ${{ matrix.lane }}
      pr-number: ${{ github.event.issue.number }}
      head-sha: ${{ needs.authorize.outputs.head-sha }}

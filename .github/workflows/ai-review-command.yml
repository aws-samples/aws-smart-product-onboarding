# On-demand AI review, mainly for fork pull requests: a maintainer comments `/ai-review` (optionally
# `/ai-review <head-sha>` to require that exact commit) on the pull request.
#
# issue_comment workflows always run from the default branch, so nothing in the pull request can
# change this file. The commenter must have write or admin permission. The head SHA is pinned
# here, then ai-review-dispatch.yml reviews exactly that commit, reading the pull request as data.
# This job never checks out or runs anything from the pull request.
name: AI review (on request)

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  authorize:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/ai-review')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the command handler from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/ai-review

      - name: Check the commenter's permission and pin the head
        id: check
        run: python3 .github/ai-review/command.py authorize

      - name: Start the review of the pinned head
        if: steps.check.outputs.allowed == 'true'
        env:
          PR: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ steps.check.outputs.head-sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run ai-review-dispatch.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
            -f pr-number="$PR" -f head-sha="$HEAD_SHA"

      - name: Tell the maintainer why the command was refused
        if: steps.check.outputs.allowed != 'true' && steps.check.outputs.reply == 'true'
        env:
          REASON: ${{ steps.check.outputs.reason }}
          PR: ${{ github.event.issue.number }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "AI review not started: $REASON."
